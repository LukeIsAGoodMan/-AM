issuerSlug: hsbc

card:
  slug: hsbc-everymile-credit-card
  cardNameEn: HSBC EveryMile Credit Card
  cardNameZh: HSBC EveryMile 信用卡
  network: Mastercard
  cardLevel: world
  annualFeeHkd: 2000
  status: active
  officialUrl: https://www.hsbc.com.hk
  notes: |
    Pre-M14 modeling — base HK$8 = 1 Asia Mile + additive overseas/FX bonus
    (HK$8 = 1 mile) for effective HK$4 = 1 mile on FX spend + additive online
    local bonus + tax exclusion (bonuses only, base still earns).

    Real card has a designated-merchant "Mile+" network with sharper rates
    that's not modeled — added in Phase 2 once T&C is read.
  qualitativeFeatures:
    xlsxCategory: Travel
    xlsxSpecialty: Air miles
    xlsxBaseRewardText: HK$2 = 1 mile local
    summaryZh: |
      HSBC EveryMile 是 HSBC 主打旅遊里數卡，海外消費及指定線上商戶有顯著加成。
    bestUseCaseZh: 海外消費、機票、累積 Asia Miles 為核心
    welcomeOfferDraft:
      spendRequirementText: HK$8,000
      bonusType: Miles / RewardCash
      bonusValueText: Up to HK$1,250 RewardCash
      periodDays: 60

