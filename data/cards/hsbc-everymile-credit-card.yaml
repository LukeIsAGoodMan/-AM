rules:
  - slug: hsbc-everymile__base_earn
    ruleName: Base earn (HK$8 = 1 mile)
    ruleType: base_earn
    status: approved
    rewardFormula:
      type: points_per_hkd
      points: 1
      perHkd: 8
      currencySlug: asia_miles
    rewardCurrencySlug: asia_miles
    sourceSlug: hsbc-everymile-official-page
    confidenceScore: 0.75
    priority: 100

  - slug: hsbc-everymile__fx_bonus
    ruleName: Foreign currency bonus (additive HK$8 = 1 mile) — SUPERSEDED
    ruleType: foreign_currency_bonus
    status: archived
    rewardFormula:
      type: points_per_hkd
      points: 1
      perHkd: 8
      currencySlug: asia_miles
    rewardCurrencySlug: asia_miles
    isForeignCurrency: true
    stackingPolicy: additive
    sourceSlug: hsbc-everymile-official-page
    confidenceScore: 0.7
    priority: 90
    notes: |
      Superseded by hsbc-everymile__fx_bonus_v2 during P17 audit fix.
      Was under-earning ~60% (effective HK$4/mile vs real HK$2/mile).

  - slug: hsbc-everymile__fx_bonus_v2
    ruleName: Foreign currency 5x (HK$2 = 1 mile)
    ruleType: foreign_currency_bonus
    status: approved
    supersedesSlug: hsbc-everymile__fx_bonus
    rewardFormula:
      type: points_per_hkd
      points: 1
      perHkd: 2
      currencySlug: asia_miles
    rewardCurrencySlug: asia_miles
    isForeignCurrency: true
    stackingPolicy: replaces_base
    sourceSlug: hsbc-everymile-official-page
    confidenceScore: 0.85
    priority: 200
    notes: |
      Real T&C: 5x miles (HK$2 = 1 mile) on foreign currency spend.
      P17-audit fix: was modelled as base + additive-same-rate (effective
      2x = HK$4/mile) — under-earning ~60%. Now replaces base directly.

  - slug: hsbc-everymile__online_local_bonus
    ruleName: Online local bonus (additive HK$8 = 1 mile) — SUPERSEDED
    ruleType: online_bonus
    status: archived
    rewardFormula:
      type: points_per_hkd
      points: 1
      perHkd: 8
      currencySlug: asia_miles
    rewardCurrencySlug: asia_miles
    isOnline: true
    isOverseas: false
    stackingPolicy: additive
    sourceSlug: hsbc-everymile-official-page
    confidenceScore: 0.65
    priority: 90
    notes: |
      Superseded by hsbc-everymile__online_local_bonus_v2 during P17
      audit fix. Was over-broad (no categorySlug → fired on every
      isOnline HK txn including utilities/ewallet) AND under-earning.

  - slug: hsbc-everymile__online_local_bonus_v2
    ruleName: Online local 5x (HK$2 = 1 mile)
    ruleType: online_bonus
    status: approved
    supersedesSlug: hsbc-everymile__online_local_bonus
    rewardFormula:
      type: points_per_hkd
      points: 1
      perHkd: 2
      currencySlug: asia_miles
    rewardCurrencySlug: asia_miles
    categorySlug: online_local
    isOnline: true
    isOverseas: false
    stackingPolicy: replaces_base
    sourceSlug: hsbc-everymile-official-page
    confidenceScore: 0.85
    priority: 200
    notes: |
      P17-audit fix (two bugs):
      1) Was missing categorySlug — rule fired on ANY isOnline HK txn,
         poisoning utilities, ewallet_topup, travel_ota rankings.
         Now scoped to categorySlug=online_local.
      2) Formula was HK$8=1mile (same as base) with additive stacking
         (effective 2x = HK$4/mile) — under-earning 60%. Real T&C is
         HK$2=1mile (5x). replaces_base ensures HK$2/mile lands directly.

  - slug: hsbc-everymile__tax_exclusion
    ruleName: Tax / government — bonus excluded
    ruleType: exclusion
    status: approved
    rewardFormula:
      type: no_reward
      reason: Tax / government category does not earn bonus miles.
    rewardCurrencySlug: asia_miles
    categorySlug: tax_government
    appliesTo:
      - category_bonus
      - online_bonus
      - overseas_bonus
      - foreign_currency_bonus
      - campaign_bonus
      - merchant_bonus
    priority: 50
    sourceSlug: hsbc-everymile-official-page
    confidenceScore: 0.8
    notes: base_earn deliberately NOT in appliesTo — tax still earns base.
